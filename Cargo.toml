[package]
name = "ferrite"
version = "0.1.2-alpha"
edition = "2021"
repository = "https://github.com/DGP2020/ferrite"

[features]
default = []
llm-http = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
toml = "0.8"
jpegxl-sys = { version = "0.10.4", features = ["vendored"] }
# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
