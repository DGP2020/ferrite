[package]
name = "ferrite"
version = "0.1.0"
edition = "2021"

[features]
default = []
llm-http = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
toml = "0.8"
